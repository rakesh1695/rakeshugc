<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .amount-display {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .amount-label {
            color: #666;
            font-size: 14px;
        }
        
        .amount-value {
            font-size: 32px;
            color: #667eea;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .info {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 3px;
            font-size: 13px;
            color: #004085;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        
        .tab-btn {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-btn:hover {
            color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .rating-section {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .stars {
            font-size: 40px;
            letter-spacing: 10px;
            margin-bottom: 15px;
        }
        
        .star {
            cursor: pointer;
            color: #ddd;
            transition: all 0.2s;
            display: inline-block;
        }
        
        .star:hover,
        .star.active {
            color: #ffc107;
            transform: scale(1.2);
        }
        
        .rating-text {
            color: #666;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
        }
        
        .rating-display {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .review-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .review-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #ffc107;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .reviewer-name {
            font-weight: 600;
            color: #333;
        }
        
        .review-rating {
            color: #ffc107;
            font-size: 14px;
        }
        
        .review-date {
            font-size: 12px;
            color: #999;
        }
        
        .review-text {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .no-reviews {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .success-tick {
            font-size: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Payment Gateway</h1>
        <p class="subtitle">Powered by Razorpay</p>
        
        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('payment')">💳 Payment</button>
            <button class="tab-btn" onclick="switchTab('review')">⭐ Reviews</button>
        </div>
        
        <!-- Payment Tab -->
        <div id="payment" class="tab-content active">
            <form id="paymentForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter your phone number" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" placeholder="What is this payment for?" rows="3"></textarea>
                </div>
                
                <div class="amount-display">
                    <div class="amount-label">Total Amount</div>
                    <div class="amount-value">₹<span id="totalAmount">0</span></div>
                </div>
                
                <button type="button" class="btn btn-primary" onclick="initiatePayment()" id="payBtn">
                    Pay Now
                </button>
            </form>
            
            <div class="status" id="status"></div>
        </div>
        
        <!-- Review Tab -->
        <div id="review" class="tab-content">
            <div id="reviewForm">
                <div class="rating-section">
                    <p style="margin-bottom: 15px; color: #333; font-weight: 600;">How would you rate us?</p>
                    <div class="stars" id="starRating">
                        <span class="star" onclick="setRating(1)">★</span>
                        <span class="star" onclick="setRating(2)">★</span>
                        <span class="star" onclick="setRating(3)">★</span>
                        <span class="star" onclick="setRating(4)">★</span>
                        <span class="star" onclick="setRating(5)">★</span>
                    </div>
                    <div class="rating-text" id="ratingText"></div>
                    <div class="rating-display" id="ratingDisplay" style="display: none;"></div>
                </div>
                
                <div class="form-group">
                    <label for="reviewerName">Your Name</label>
                    <input type="text" id="reviewerName" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label for="reviewerEmail">Email (Optional)</label>
                    <input type="email" id="reviewerEmail" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="reviewText">Your Review</label>
                    <textarea id="reviewText" placeholder="Share your experience with us..." rows="4" required></textarea>
                </div>
                
                <button type="button" class="btn btn-primary" onclick="submitReview()">
                    Submit Review
                </button>
                
                <div class="status" id="reviewStatus"></div>
            </div>
            
            <!-- Reviews Display Section -->
            <div style="margin-top: 40px;">
                <h3 style="margin-bottom: 20px; color: #333;">Client Reviews</h3>
                <div class="review-list" id="reviewsList">
                    <div class="no-reviews">No reviews yet. Be the first to review!</div>
                </div>
            </div>
        </div>
        
        <div class="info">
            <strong>ℹ️ Test Credentials:</strong><br>
            • Card: 4111 1111 1111 1111<br>
            • Expiry: Any future date<br>
            • CVV: Any 3 digits
        </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        // ========== REVIEW FUNCTIONALITY ==========
        let currentRating = 0;
        const ratingTexts = {
            1: '😞 Poor',
            2: '😕 Not Good',
            3: '😐 Average',
            4: '😊 Good',
            5: '😍 Excellent'
        };
        
        // Initialize reviews from localStorage
        let reviews = JSON.parse(localStorage.getItem('clientReviews')) || [];
        
        function setRating(rating) {
            currentRating = rating;
            // Update star styling
            const stars = document.querySelectorAll('#starRating .star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
            
            // Update rating text
            document.getElementById('ratingText').textContent = ratingTexts[rating];
            document.getElementById('ratingDisplay').innerHTML = `${rating} / 5 Stars`;
            document.getElementById('ratingDisplay').style.display = 'block';
        }
        
        function submitReview() {
            const name = document.getElementById('reviewerName').value;
            const email = document.getElementById('reviewerEmail').value;
            const text = document.getElementById('reviewText').value;
            
            if (!name || !text || currentRating === 0) {
                showReviewStatus('Please fill all fields and select a rating', 'error');
                return;
            }
            
            // Create review object
            const review = {
                id: Date.now(),
                name: name,
                email: email,
                rating: currentRating,
                text: text,
                date: new Date().toLocaleDateString('en-IN')
            };
            
            // Add to reviews array
            reviews.unshift(review);
            
            // Save to localStorage
            localStorage.setItem('clientReviews', JSON.stringify(reviews));
            
            // Show success message
            showReviewStatus('✓ Thank you! Your review has been submitted successfully.', 'success');
            
            // Reset form
            document.getElementById('reviewerName').value = '';
            document.getElementById('reviewerEmail').value = '';
            document.getElementById('reviewText').value = '';
            currentRating = 0;
            document.querySelectorAll('#starRating .star').forEach(star => star.classList.remove('active'));
            document.getElementById('ratingText').textContent = '';
            document.getElementById('ratingDisplay').style.display = 'none';
            
            // Refresh reviews display
            displayReviews();
            
            // Scroll to reviews
            setTimeout(() => {
                document.querySelector('.review-list').scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }
        
        function displayReviews() {
            const reviewsList = document.getElementById('reviewsList');
            
            if (reviews.length === 0) {
                reviewsList.innerHTML = '<div class="no-reviews">No reviews yet. Be the first to review!</div>';
                return;
            }
            
            reviewsList.innerHTML = reviews.map(review => `
                <div class="review-item">
                    <div class="review-header">
                        <div>
                            <div class="reviewer-name">${escapeHtml(review.name)}</div>
                            <div class="review-date">${review.date}</div>
                        </div>
                        <div class="review-rating">${'★'.repeat(review.rating)}</div>
                    </div>
                    <div class="review-text">${escapeHtml(review.text)}</div>
                </div>
            `).join('');
        }
        
        function showReviewStatus(message, type) {
            const statusDiv = document.getElementById('reviewStatus');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // ========== TAB SWITCHING ==========
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Remove active class from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            
            // Add active class to clicked button
            event.target.classList.add('active');
            
            // Load reviews when switching to review tab
            if (tabName === 'review') {
                displayReviews();
            }
        }
        
        // ========== PAYMENT FUNCTIONALITY ==========
        // Update total amount display
        document.getElementById('amount').addEventListener('change', function() {
            document.getElementById('totalAmount').innerHTML = this.value || '0';
        });
        
        // API Configuration - Use your own API key here
        const API_KEY = 'rzp_live_TYjSid4VAbTyo8'; // Replace with your actual key
        const API_SECRET = 'sTjGZC4mSgUvB2LOeTm07O1K'; // Keep this on backend only!
        
        function initiatePayment() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;
            
            if (!name || !email || !phone || !amount) {
                showStatus('Please fill all required fields', 'error');
                return;
            }
            
            // Amount in paise (multiply by 100)
            const amountInPaise = Math.round(amount * 100);
            
            const options = {
                key: API_KEY,
                amount: amountInPaise,
                currency: 'INR',
                name: 'Your Company Name',
                description: description || 'Payment for services',
                prefill: {
                    name: name,
                    email: email,
                    contact: phone
                },
                handler: function(response) {
                    // Success callback
                    showStatus(`Payment Successful! Payment ID: ${response.razorpay_payment_id}`, 'success');
                    console.log('Payment response:', response);
                    
                    // Here you would normally send the payment details to your backend
                    // for verification and further processing
                },
                modal: {
                    ondismiss: function() {
                        showStatus('Payment cancelled', 'error');
                    }
                }
            };
            
            const rzp = new Razorpay(options);
            rzp.open();
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }
        
        // Load reviews on page load
        window.addEventListener('load', function() {
            displayReviews();
        });
    </script>
</body>
</html>
